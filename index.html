<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rivo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root {
            --bg-main: #0e1621; --bg-panel: #17212b; --bg-input: #242f3d;
            --accent: #5eb5f7; --accent-hover: #4993c9; --text-main: #ffffff; --text-muted: #7f91a4;
            --border: #101921; --gold: #fbbf24; --online: #31a24c; --danger: #ef4444;
        }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background: var(--bg-main); color: var(--text-main); font-family: 'Inter', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        #app { display: flex; width: 100%; height: 100%; }

        .coin-icon { vertical-align: middle; width: 16px; height: 16px; margin-right: 4px; margin-top: -2px; }

        /* ЛЕВАЯ ПАНЕЛЬ */
        #sidebar { width: 340px; background: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 2; }
        .sidebar-header { padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; background: var(--bg-panel); }
        .menu-btn { cursor: pointer; font-size: 20px; color: var(--text-muted); padding: 5px; }
        .menu-btn:hover { color: var(--text-main); }
        
        .header-balance { background: rgba(251, 191, 36, 0.15); border: 1px solid var(--gold); color: var(--gold); padding: 2px 8px; border-radius: 10px; font-size: 13px; font-weight: bold; display: flex; align-items: center; }

        .search-container { position: relative; margin: 5px 15px 15px; }
        #search-input { width: 100%; padding: 10px 35px 10px 15px; border-radius: 20px; border: none; background: var(--bg-input); color: white; outline: none; font-size: 14px; }
        #clear-search { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-muted); display: none; font-size: 18px; }

        #chat-list { flex: 1; overflow-y: auto; }
        .chat-item { padding: 10px 15px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: 0.1s; }
        .chat-item:hover { background: var(--bg-input); }
        
        .avatar-box { width: 54px; height: 54px; border-radius: 50%; background: #202b36; display: flex; justify-content: center; align-items: center; font-size: 24px; position: relative; overflow: hidden; flex-shrink: 0; }
        .avatar-box img { width: 100%; height: 100%; object-fit: cover; }
        .status-dot { width: 14px; height: 14px; border-radius: 50%; position: absolute; bottom: 0; right: 0; border: 2px solid var(--bg-panel); }
        .online { background-color: var(--online); } .offline { background-color: var(--text-muted); }
        
        .chat-info { flex: 1; overflow: hidden; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .chat-item:last-child .chat-info { border-bottom: none; }
        .chat-top { display: flex; justify-content: space-between; margin-bottom: 3px; }
        .chat-name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-bottom { display: flex; justify-content: space-between; align-items: center; }
        .chat-msg { font-size: 14px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
        .unread-badge { background: var(--accent); color: white; border-radius: 10px; padding: 2px 6px; font-size: 11px; font-weight: 600; }

        .search-hint { text-align: center; color: var(--text-muted); font-size: 13px; margin-top: 20px; padding: 0 20px; }

        /* ПРАВАЯ ПАНЕЛЬ (ЧАТ) */
        #chat-area { flex: 1; display: flex; flex-direction: column; background: #0e1621 url('https://web.telegram.org/img/tg_bg_pattern.png') repeat; position: relative; }
        #chat-header { padding: 10px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--bg-panel); z-index: 1;}
        .header-info { display: flex; align-items: center; gap: 15px; cursor: pointer; }
        .header-info:hover .chat-name { color: var(--accent); }
        .header-name { font-weight: 600; font-size: 16px; }
        .header-status { font-size: 13px; color: var(--text-muted); }

        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .msg-bubble { max-width: 60%; padding: 10px 14px; border-radius: 12px; word-wrap: break-word; font-size: 15px; line-height: 1.4; position: relative; }
        .my-msg { background: #2b5278; align-self: flex-end; border-bottom-right-radius: 4px; }
        .their-msg { background: #182533; align-self: flex-start; border-bottom-left-radius: 4px; }
        .sender-name { font-size: 12px; font-weight: 600; color: var(--accent); margin-bottom: 3px; }
        .msg-time { font-size: 11px; color: rgba(255,255,255,0.4); float: right; margin: 5px 0 0 10px; }

        #input-area { padding: 10px 20px; display: flex; gap: 10px; background: var(--bg-panel); align-items: center; z-index: 1;}
        #message-input { flex: 1; padding: 12px 15px; border-radius: 20px; border: none; background: var(--bg-input); color: white; outline: none; font-size: 15px; }
        .action-btn { background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; padding: 5px; transition: 0.2s; }
        .action-btn:hover { color: var(--accent); }

        /* МОДАЛКИ */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .modal-box { background: var(--bg-panel); border-radius: 12px; width: 400px; max-height: 90vh; overflow-y: auto; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .modal-box h2 { margin-top: 0; text-align: center; font-weight: 500; font-size: 20px; }
        .modal-box input, .modal-box select { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-main); color: white; outline: none; font-size: 15px; }
        .modal-box button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: var(--accent); color: white; font-weight: 600; cursor: pointer; margin-bottom: 10px; }
        .modal-box button:hover { background: var(--accent-hover); }
        .hidden { display: none !important; }

        .profile-avatar-big { width: 100px; height: 100px; border-radius: 50%; background: #202b36; margin: 0 auto 15px; display: flex; justify-content: center; align-items: center; font-size: 40px; overflow: hidden; }
        .profile-avatar-big img { width: 100%; height: 100%; object-fit: cover; }
        .profile-field { background: var(--bg-main); padding: 12px 15px; border-radius: 8px; margin-bottom: 10px; }
        .profile-label { font-size: 12px; color: var(--accent); margin-bottom: 4px; }
        .profile-value { font-size: 15px; color: white; }
        
        .profile-balance { background: rgba(251, 191, 36, 0.1); border: 1px solid var(--gold); padding: 12px 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .profile-balance span:first-child { color: var(--gold); font-weight: 600; font-size: 15px; }
        .profile-balance span:last-child { color: var(--gold); font-weight: bold; font-size: 18px; display: flex; align-items: center;}

        /* МАГАЗИН */
        .shop-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .shop-item { background: var(--bg-main); padding: 20px 10px; border-radius: 12px; text-align: center; cursor: pointer; border: 1px solid var(--border); transition: 0.2s; }
        .shop-item:hover { background: var(--bg-input); transform: translateY(-2px); border-color: var(--gold);}
        .shop-svg { width: 60px; height: 60px; display: block; margin: 0 auto 10px; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5)); }
        .shop-price { color: var(--gold); font-size: 14px; font-weight: bold; }
        
        .gift-event { align-self: center; text-align: center; margin: 15px 0; animation: pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .gift-svg-big { width: 120px; height: 120px; filter: drop-shadow(0 0 20px rgba(251, 191, 36, 0.5)); animation: float 3s ease-in-out infinite; }
        .gift-text { background: rgba(0,0,0,0.6); padding: 8px 20px; border-radius: 20px; margin-top: 10px; display: inline-block; font-size: 14px; color: #fff; border: 1px solid var(--gold); backdrop-filter: blur(5px);}
        
        @keyframes pop { 0% { transform: scale(0); } 80% { transform: scale(1.1); } 100% { transform: scale(1); } }
        @keyframes float { 0% { transform: translateY(0); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0); } }

        .profile-gift-card { background: var(--bg-main); padding: 10px; border-radius: 10px; text-align: center; width: 100px; border: 1px solid var(--border); }
        .profile-gift-svg { width: 50px; height: 50px; margin-bottom: 5px; }
        .profile-gift-sender { font-size: 10px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .profile-gift-comment { font-size: 10px; color: var(--gold); margin-top: 3px; font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .admin-btn { background: linear-gradient(135deg, #fbbf24, #f59e0b) !important; color: #000 !important; font-weight: bold; }
        .admin-btn:hover { box-shadow: 0 0 15px rgba(251, 191, 36, 0.5); }

        #back-btn { display: none; cursor: pointer; font-size: 24px; color: var(--accent); margin-right: 10px; }
        @media (max-width: 768px) {
            #sidebar { width: 100%; border-right: none; }
            #chat-area { display: none; width: 100%; position: absolute; top: 0; left: 0; height: 100%; z-index: 10; }
            #back-btn { display: block; }
            .msg-bubble { max-width: 85%; }
            .modal-box { width: 95%; padding: 15px; }
        }
    </style>
</head>
<body>

    <div id="login-overlay" class="modal-overlay">
        <div class="modal-box">
            <h2>Rivo</h2>
            <input type="text" id="auth-username" placeholder="Юзернейм">
            <input type="password" id="auth-password" placeholder="Пароль">
            <button id="main-auth-btn" onclick="submitAuth()">Войти</button>
            <div style="text-align:center; color:var(--accent); cursor:pointer;" id="switch-text" onclick="toggleAuthMode()">Нет аккаунта? Зарегистрироваться</div>
            <div id="auth-error" style="color: #ef4444; margin-top: 10px; text-align: center; font-size: 14px;"></div>
        </div>
    </div>

    <div id="profile-view-overlay" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="profile-avatar-big" id="view-avatar"></div>
            <h3 style="text-align:center; margin:0;" id="view-name"></h3>
            <p style="text-align:center; color:var(--text-muted); margin:5px 0 20px;" id="view-status"></p>
            
            <div class="profile-field"><div class="profile-label">ID пользователя</div><div class="profile-value" id="view-id"></div></div>
            <div class="profile-field"><div class="profile-label">Имя пользователя</div><div class="profile-value" id="view-username"></div></div>
            <div class="profile-field"><div class="profile-label">О себе</div><div class="profile-value" id="view-bio"></div></div>
            
            <div class="profile-balance">
                <span>Баланс R-коинов</span>
                <span id="view-balance">0</span>
            </div>

            <h4 style="margin-top:20px; color:var(--text-muted); text-align:center;">Подарки</h4>
            <div id="view-gifts" style="display:flex; flex-wrap:wrap; gap:10px; justify-content:center;"></div>
            
            <div id="other-profile-actions" style="display:flex; gap:10px; margin-top:20px; flex-direction:column;">
                <div style="display:flex; gap:10px; width:100%;">
                    <button id="block-btn" onclick="toggleBlock()" style="background:var(--danger); flex:1; margin:0;">Заблокировать</button>
                    <button onclick="deleteChat()" style="background:var(--bg-input); flex:1; margin:0;">Удалить чат</button>
                </div>
                <button id="admin-give-btn" class="admin-btn hidden" onclick="adminGiveCoins()" style="margin-top:10px;">Начислить 100 R этому юзеру</button>
            </div>
            
            <div id="my-profile-actions" class="hidden" style="margin-top:20px; display: flex; flex-direction: column; gap: 10px;">
                <button onclick="openSettings()" style="background:var(--accent); margin: 0;">Редактировать профиль</button>
                <button onclick="logout()" style="background:var(--danger); margin: 0;">Выйти из аккаунта</button>
            </div>

            <button onclick="document.getElementById('profile-view-overlay').classList.add('hidden')" style="margin-top:10px; background:transparent; border:1px solid var(--border);">Закрыть</button>
        </div>
    </div>

    <div id="settings-overlay" class="modal-overlay hidden">
        <div class="modal-box">
            <h2>Настройки</h2>
            <div class="profile-balance">
                <span>Ваш баланс</span>
                <span id="settings-balance">0</span>
            </div>

            <div style="margin-bottom: 20px; background: rgba(255,255,255,0.03); padding: 10px; border-radius: 8px; border: 1px dashed var(--accent);">
                <label style="font-size:12px; color:var(--accent); font-weight:bold; margin-bottom:5px; display:block;">Ввести промокод</label>
                <div style="display:flex; gap:8px;">
                    <input type="text" id="redeem-code-input" placeholder="RIVO100" style="margin-bottom:0; text-transform:uppercase; flex:1;">
                    <button onclick="redeemPromo()" style="width:auto; margin-bottom:0; padding:0 15px; background:var(--gold); color:black; font-weight:bold;">OK</button>
                </div>
                <div id="redeem-msg" style="font-size:12px; margin-top:5px; text-align:center; font-weight:bold;"></div>
            </div>

            <div style="text-align:center; margin-bottom:15px;">
                <div class="profile-avatar-big" id="settings-avatar-preview"></div>
                <label for="avatar-upload" style="background:var(--bg-input); padding:8px 15px; border-radius:20px; cursor:pointer; font-size:13px;">Сменить фото</label>
                <input type="file" id="avatar-upload" accept="image/*" style="display:none;" onchange="handleAvatarUpload(event)">
            </div>
            <label style="font-size:12px; color:var(--text-muted);">Отображаемое имя</label>
            <input type="text" id="settings-display-name">
            <label style="font-size:12px; color:var(--text-muted);">6-значный ID</label>
            <input type="text" id="settings-six-id" maxlength="6">
            <label style="font-size:12px; color:var(--text-muted);">О себе</label>
            <input type="text" id="settings-bio">
            <button onclick="saveProfile()">Сохранить</button>
            
            <div id="admin-panel" class="hidden" style="margin-top: 20px; border-top: 1px solid var(--border); padding-top: 15px;">
                <h3 style="text-align:center; font-size:16px; color: var(--gold);">Панель создателя</h3>
                <div style="text-align:center; margin-bottom:10px; font-size:14px; color:var(--text-muted);">Всего в Rivo: <b id="total-users-count" style="color:white;">0</b> чел.</div>
                
                <button class="admin-btn" onclick="adminGiveSelfCoins()">Начислить себе 10 000 R</button>
                
                <div style="margin-top:15px;">
                    <input type="text" id="promo-code-input" placeholder="Название промокода (напр. RIVO100)">
                    <input type="number" id="promo-reward-input" placeholder="Награда (коины)" value="50">
                    <input type="number" id="promo-limit-input" placeholder="Лимит (сколько людей)" value="10">
                    <button onclick="createPromo()" style="background: var(--gold); color: black;">Создать промокод</button>
                </div>
                <div id="promo-admin-msg" style="text-align:center; font-size:12px; margin-top:10px; font-weight:bold;"></div>
            </div>

            <button onclick="logout()" style="background:var(--danger); margin-top: 20px;">Выйти из аккаунта</button>
            <button onclick="document.getElementById('settings-overlay').classList.add('hidden')" style="background:transparent; border:1px solid var(--border);">Отмена</button>
        </div>
    </div>

    <div id="shop-overlay" class="modal-overlay hidden">
        <div class="modal-box">
            <h2>Магазин подарков</h2>
            <div style="text-align:center; color:var(--gold); margin-bottom:15px; font-weight:bold; font-size:16px;">
                Ваш баланс: <span id="shop-balance">0</span> R
            </div>
            <div class="shop-grid" id="shop-grid"></div>
            <button onclick="document.getElementById('shop-overlay').classList.add('hidden')" style="margin-top:15px; background:var(--bg-input);">Отмена</button>
        </div>
    </div>

    <div id="group-overlay" class="modal-overlay hidden">
        <div class="modal-box">
            <h2>Новая группа</h2>
            <input type="text" id="group-name" placeholder="Название группы">
            <div style="font-size:12px; color:var(--text-muted); margin-bottom:5px;">Выберите участников:</div>
            <div id="group-members-list" style="max-height:150px; overflow-y:auto; margin-bottom:15px; border:1px solid var(--border); border-radius:8px;"></div>
            <button onclick="createGroup()">Создать</button>
            <button onclick="document.getElementById('group-overlay').classList.add('hidden')" style="background:transparent; border:1px solid var(--border);">Отмена</button>
        </div>
    </div>

    <div id="app" class="hidden">
        <div id="sidebar">
            <div class="sidebar-header">
                <div class="menu-btn" onclick="openMyProfile()">☰</div>
                <div style="display:flex; align-items:center; gap:10px;">
                    <div style="font-weight:bold; font-size:18px;">Rivo</div>
                    <div class="header-balance">
                        <svg class="coin-icon" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="url(#paint0_linear)"/><circle cx="12" cy="12" r="8" stroke="#B45309" stroke-width="1.5"/><path d="M9 16V8H12.5C14.433 8 16 9.119 16 11C16 12.881 14.433 14 12.5 14H11V16H9ZM11 12H12.5C13.3284 12 14 11.552 14 11C14 10.448 13.3284 10 12.5 10H11V12Z" fill="#78350F"/><defs><linearGradient id="paint0_linear" x1="12" y1="2" x2="12" y2="22" gradientUnits="userSpaceOnUse"><stop stop-color="#FDE047"/><stop offset="1" stop-color="#EAB308"/></linearGradient></defs></svg>
                        <span id="header-balance-val">0</span>
                    </div>
                </div>
                <div class="menu-btn" onclick="openCreateGroup()">➕</div>
            </div>
            
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Поиск (имя, @юзер или ID)..." oninput="onSearchInput()">
                <span id="clear-search" onclick="clearSearch()">×</span>
            </div>
            
            <div id="chat-list"></div>
        </div>

        <div id="chat-area">
            <div id="chat-header">
                <div style="display:flex; align-items:center;">
                    <div id="back-btn" onclick="closeChat()">←</div>
                    <div class="header-info" onclick="openUserProfile(currentChatId)">
                        <div class="avatar-box" id="chat-header-avatar"></div>
                        <div>
                            <div class="header-name" id="chat-with">Выберите чат</div>
                            <div class="header-status" id="chat-status">В сети</div>
                        </div>
                    </div>
                </div>
            </div>
            <div id="messages"></div>
            <div id="input-area">
                <button class="action-btn" onclick="openShop()" id="gift-btn" disabled>🎁</button>
                <input type="text" id="message-input" placeholder="Написать сообщение..." disabled>
                <button class="action-btn" onclick="sendMessage()" id="send-btn" disabled>➤</button>
            </div>
        </div>
    </div>

    <script>
        let ws, myUser = null, isLoginMode = true;
        let allUsers = []; 
        let myContacts = []; 
        let myGroups = [];
        let currentChatId = null; 
        let currentChatType = null; 
        let unreadMessages = {};
        
        let selectedAvatarBase64 = "";
        let viewingUser = null;
        let currentUserBlocked = false;

        // КРАСИВЫЕ SVG ПОДАРКИ ВМЕСТО СМАЙЛИКОВ
        const GIFT_ROSE = `<svg class="shop-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M50 20C30 20 20 35 20 50C20 65 35 80 50 80C65 80 80 65 80 50C80 35 70 20 50 20Z" fill="url(#roseGrad)"/><path d="M50 40C40 40 35 45 35 50C35 55 40 60 50 60C60 60 65 55 65 50C65 45 60 40 50 40Z" fill="#800000"/><path d="M50 80V95" stroke="#2e8b57" stroke-width="4" stroke-linecap="round"/><path d="M50 85C40 85 35 90 30 90" stroke="#2e8b57" stroke-width="4" stroke-linecap="round"/><defs><linearGradient id="roseGrad" x1="50" y1="20" x2="50" y2="80" gradientUnits="userSpaceOnUse"><stop stop-color="#FF4B4B"/><stop offset="1" stop-color="#990000"/></linearGradient></defs></svg>`;
        
        const GIFT_DIAMOND = `<svg class="shop-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M50 10L90 40L50 90L10 40L50 10Z" fill="url(#diaGrad)"/><path d="M50 10L30 40L50 90L70 40L50 10Z" fill="#00BFFF" opacity="0.6"/><path d="M10 40H90" stroke="#E0FFFF" stroke-width="2"/><defs><linearGradient id="diaGrad" x1="50" y1="10" x2="50" y2="90" gradientUnits="userSpaceOnUse"><stop stop-color="#E0FFFF"/><stop offset="1" stop-color="#00BFFF"/></linearGradient></defs></svg>`;

        const GIFT_BEAR = `<svg class="shop-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="30" cy="30" r="15" fill="#8B4513"/><circle cx="70" cy="30" r="15" fill="#8B4513"/><circle cx="50" cy="55" r="30" fill="url(#bearGrad)"/><circle cx="38" cy="50" r="4" fill="#000"/><circle cx="62" cy="50" r="4" fill="#000"/><ellipse cx="50" cy="65" rx="10" ry="7" fill="#D2B48C"/><circle cx="50" cy="62" r="3" fill="#000"/><defs><linearGradient id="bearGrad" x1="50" y1="25" x2="50" y2="85" gradientUnits="userSpaceOnUse"><stop stop-color="#D2691E"/><stop offset="1" stop-color="#8B4513"/></linearGradient></defs></svg>`;

        const GIFT_CROWN = `<svg class="shop-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M15 70L10 30L35 50L50 15L65 50L90 30L85 70H15Z" fill="url(#crownGrad)"/><rect x="15" y="70" width="70" height="15" rx="5" fill="#B8860B"/><circle cx="50" cy="25" r="4" fill="#FF0000"/><circle cx="25" cy="40" r="3" fill="#0000FF"/><circle cx="75" cy="40" r="3" fill="#0000FF"/><defs><linearGradient id="crownGrad" x1="50" y1="15" x2="50" y2="70" gradientUnits="userSpaceOnUse"><stop stop-color="#FFD700"/><stop offset="1" stop-color="#DAA520"/></linearGradient></defs></svg>`;

        const gifts = [
            { id: 'gift_rose', svg: GIFT_ROSE, price: 10 },
            { id: 'gift_diamond', svg: GIFT_DIAMOND, price: 50 },
            { id: 'gift_bear', svg: GIFT_BEAR, price: 100 },
            { id: 'gift_crown', svg: GIFT_CROWN, price: 500 }
        ];

        const coinSvg = `<svg class="coin-icon" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="url(#paint0_linear)"/><circle cx="12" cy="12" r="8" stroke="#B45309" stroke-width="1.5"/><path d="M9 16V8H12.5C14.433 8 16 9.119 16 11C16 12.881 14.433 14 12.5 14H11V16H9ZM11 12H12.5C13.3284 12 14 11.552 14 11C14 10.448 13.3284 10 12.5 10H11V12Z" fill="#78350F"/><defs><linearGradient id="paint0_linear" x1="12" y1="2" x2="12" y2="22" gradientUnits="userSpaceOnUse"><stop stop-color="#FDE047"/><stop offset="1" stop-color="#EAB308"/></linearGradient></defs></svg>`;

        function getGiftById(id) {
            const gift = gifts.find(g => g.id === id);
            return gift ? gift.svg : id; // Если не нашли, возвращаем старый эмодзи (для совместимости)
        }

        function updateBalanceUI() {
            if(!myUser) return;
            document.getElementById('header-balance-val').innerText = myUser.coins;
            document.getElementById('shop-balance').innerText = myUser.coins;
            document.getElementById('settings-balance').innerHTML = `${coinSvg} ${myUser.coins}`;
        }

        function handleAvatarUpload(e) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_SIZE = 100;
                    let width = img.width; let height = img.height;
                    if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } }
                    else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    selectedAvatarBase64 = canvas.toDataURL('image/jpeg');
                    document.getElementById('settings-avatar-preview').innerHTML = `<img src="${selectedAvatarBase64}">`;
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        }

        window.onload = function() {
            const shopGrid = document.getElementById('shop-grid');
            gifts.forEach(g => {
                const div = document.createElement('div');
                div.className = 'shop-item';
                div.innerHTML = `${g.svg}<span class="shop-price">${g.price} R</span>`;
                div.onclick = () => buyGift(g.id, g.price);
                shopGrid.appendChild(div);
            });

            const savedUser = localStorage.getItem('rivo_user');
            const savedPass = localStorage.getItem('rivo_pass');
            if (savedUser && savedPass) {
                document.getElementById('auth-username').value = savedUser;
                document.getElementById('auth-password').value = savedPass;
                submitAuth();
            }
        };

        function logout() { localStorage.removeItem('rivo_user'); localStorage.removeItem('rivo_pass'); location.reload(); }
        function toggleAuthMode() { isLoginMode = !isLoginMode; document.getElementById('main-auth-btn').innerText = isLoginMode ? 'Войти' : 'Создать аккаунт'; document.getElementById('switch-text').innerText = isLoginMode ? 'Нет аккаунта? Зарегистрироваться' : 'Уже есть аккаунт? Войти'; document.getElementById('auth-error').innerText = ''; }

        function onSearchInput() {
            const val = document.getElementById('search-input').value;
            document.getElementById('clear-search').style.display = val.length > 0 ? 'block' : 'none';
            renderChats();
        }
        
        function clearSearch() {
            document.getElementById('search-input').value = '';
            document.getElementById('clear-search').style.display = 'none';
            renderChats();
        }

        function submitAuth() {
            const user = document.getElementById('auth-username').value.trim();
            const pass = document.getElementById('auth-password').value.trim();
            if(!user || !pass) return document.getElementById('auth-error').innerText = "Заполните поля!";

            const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
            if(ws) ws.close();
            ws = new WebSocket(protocol + window.location.host);

            ws.onopen = () => ws.send(JSON.stringify({ type: isLoginMode ? 'login' : 'register', username: user, password: pass }));

            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                if (data.type === 'force_logout') { alert(data.message); logout(); return; }
                if (data.type === 'auth_error') document.getElementById('auth-error').innerText = data.message;
                
                if (data.type === 'auth_success') {
                    if(!isLoginMode) { toggleAuthMode(); setTimeout(submitAuth, 500); return; }
                    localStorage.setItem('rivo_user', user);
                    localStorage.setItem('rivo_pass', pass);
                    myUser = data.user;
                    selectedAvatarBase64 = myUser.avatar;
                    
                    if (myUser.username === 'revezzz') {
                        document.getElementById('admin-panel').classList.remove('hidden');
                    } else {
                        document.getElementById('admin-panel').classList.add('hidden');
                    }

                    document.getElementById('login-overlay').classList.add('hidden');
                    document.getElementById('app').classList.remove('hidden');
                    
                    updateBalanceUI();
                    
                    ws.send(JSON.stringify({ type: 'get_groups' })); 
                    ws.send(JSON.stringify({ type: 'get_chat_list' })); 
                    setupAppLogic();
                }
                
                if(data.type === 'user_list') { 
                    allUsers = data.users; 
                    document.getElementById('total-users-count').innerText = allUsers.length; // СЧЕТЧИК ПОЛЬЗОВАТЕЛЕЙ
                    renderChats(); 
                }
                if(data.type === 'chat_list') { myContacts = data.contacts; renderChats(); }
                if(data.type === 'my_groups') { myGroups = data.groups; renderChats(); }
                
                if (data.type === 'history') {
                    const messagesDiv = document.getElementById('messages');
                    messagesDiv.innerHTML = '';
                    data.messages.forEach(msg => {
                        const isMe = msg.sender === myUser.username;
                        if (msg.isGift) {
                            addGiftToScreen(msg.text, isMe ? "Вы" : msg.sender, msg.comment);
                        } else {
                            let senderHtml = (!isMe && currentChatType === 'group') ? `<div class="sender-name">${msg.sender}</div>` : '';
                            let msgHtml = `${senderHtml}${msg.text} <span class="msg-time">${msg.timestamp || ''}</span>`;
                            addMsgToScreen(msgHtml, isMe ? 'my-msg' : 'their-msg', false);
                        }
                    });
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                }
                
                if (data.type === 'private' || data.type === 'group_message') {
                    const chatId = data.type === 'private' ? data.from : 'group_' + data.groupId;
                    if (currentChatId === chatId) {
                        if (data.isGift) {
                            addGiftToScreen(data.text, data.from, data.comment);
                        } else {
                            let senderHtml = (data.type === 'group_message' && data.from !== myUser.username) ? `<div class="sender-name">${data.from}</div>` : '';
                            addMsgToScreen(`${senderHtml}${data.text} <span class="msg-time">${data.time}</span>`, data.from === myUser.username ? 'my-msg' : 'their-msg', true);
                        }
                    } else {
                        unreadMessages[chatId] = (unreadMessages[chatId] || 0) + 1;
                        if (data.type === 'private' && !myContacts.includes(data.from)) myContacts.push(data.from); 
                        renderChats();
                    }
                }
                
                if (data.type === 'profile_data') {
                    const u = data.user;
                    viewingUser = u.username;
                    currentUserBlocked = data.iBlocked;
                    
                    document.getElementById('view-avatar').innerHTML = u.avatar ? `<img src="${u.avatar}">` : '👤';
                    document.getElementById('view-name').innerText = u.display_name;
                    document.getElementById('view-status').innerText = u.status === 'online' ? 'В сети' : 'Не в сети';
                    document.getElementById('view-id').innerText = u.six_digit_id;
                    document.getElementById('view-username').innerText = '@' + u.username;
                    document.getElementById('view-bio').innerText = u.bio;
                    
                    document.getElementById('view-balance').innerHTML = `${coinSvg} ${u.coins}`;

                    if (u.username === myUser.username) {
                        document.getElementById('other-profile-actions').style.display = 'none';
                        document.getElementById('my-profile-actions').classList.remove('hidden');
                    } else {
                        document.getElementById('other-profile-actions').style.display = 'flex';
                        document.getElementById('my-profile-actions').classList.add('hidden');
                        
                        if (myUser.username === 'revezzz') {
                            document.getElementById('admin-give-btn').classList.remove('hidden');
                        } else {
                            document.getElementById('admin-give-btn').classList.add('hidden');
                        }

                        const blockBtn = document.getElementById('block-btn');
                        if (data.iBlocked) {
                            blockBtn.innerText = "Разблокировать";
                            blockBtn.style.background = "var(--online)";
                        } else {
                            blockBtn.innerText = "Заблокировать";
                            blockBtn.style.background = "var(--danger)";
                        }
                    }

                    const giftsDiv = document.getElementById('view-gifts');
                    giftsDiv.innerHTML = '';
                    if (data.gifts.length === 0) {
                        giftsDiv.innerHTML = '<p style="color:var(--text-muted); font-size:13px; width:100%; text-align:center;">Пока нет подарков</p>';
                    } else {
                        data.gifts.forEach(g => {
                            const div = document.createElement('div');
                            div.className = 'profile-gift-card';
                            let giftComment = (g.comment && g.comment !== 'undefined') ? `<div class="profile-gift-comment" title="${g.comment}">"${g.comment}"</div>` : '';
                            
                            // ВЫВОДИМ SVG В ПРОФИЛЕ
                            let svgHtml = getGiftById(g.gift_emoji);
                            if(svgHtml.includes('<svg')) {
                                svgHtml = svgHtml.replace('class="shop-svg"', 'class="profile-gift-svg"');
                            }

                            div.innerHTML = `
                                ${svgHtml}
                                <div class="profile-gift-sender">от ${g.sender}</div>
                                ${giftComment}
                            `;
                            giftsDiv.appendChild(div);
                        });
                    }
                    document.getElementById('profile-view-overlay').classList.remove('hidden');
                }
                
                if (data.type === 'profile_saved') {
                    myUser = data.user;
                    selectedAvatarBase64 = myUser.avatar;
                    updateBalanceUI();
                    alert('Профиль успешно обновлен!');
                    document.getElementById('settings-overlay').classList.add('hidden');
                    openMyProfile(); 
                }

                if (data.type === 'action_success') {
                    if (data.action === 'block') {
                        alert('Пользователь заблокирован.');
                        currentUserBlocked = true;
                        document.getElementById('block-btn').innerText = "Разблокировать";
                        document.getElementById('block-btn').style.background = "var(--online)";
                    } else if (data.action === 'unblock') {
                        alert('Пользователь разблокирован.');
                        currentUserBlocked = false;
                        document.getElementById('block-btn').innerText = "Заблокировать";
                        document.getElementById('block-btn').style.background = "var(--danger)";
                    }
                }

                if (data.type === 'chat_deleted') {
                    alert('Чат удален.');
                    document.getElementById('profile-view-overlay').classList.add('hidden');
                    myContacts = myContacts.filter(c => c !== data.target);
                    if (currentChatId === data.target) {
                        closeChat();
                        document.getElementById('messages').innerHTML = '';
                    }
                    renderChats();
                }

                if (data.type === 'update_coins') {
                    myUser.coins = data.coins;
                    updateBalanceUI(); 
                }
                if (data.type === 'group_created') {
                    ws.send(JSON.stringify({ type: 'get_groups' }));
                    document.getElementById('group-overlay').classList.add('hidden');
                }
                
                if (data.type === 'promo_result') {
                    if (data.newBalance !== undefined) {
                        myUser.coins = data.newBalance;
                        updateBalanceUI();
                    }
                    
                    const redeemMsg = document.getElementById('redeem-msg');
                    if(redeemMsg) {
                        redeemMsg.innerText = data.message;
                        redeemMsg.style.color = data.success ? 'var(--online)' : 'var(--danger)';
                        if(data.success) {
                            document.getElementById('redeem-code-input').value = '';
                            setTimeout(() => redeemMsg.innerText = '', 3000);
                        }
                    }
                    
                    const adminMsg = document.getElementById('promo-admin-msg');
                    if(adminMsg) {
                        adminMsg.innerText = data.message;
                        adminMsg.style.color = data.success ? 'var(--online)' : 'var(--danger)';
                        if(data.success) setTimeout(() => adminMsg.innerText = '', 3000);
                    }
                }

                if (data.type === 'admin_success') {
                    alert(data.message);
                }
                if (data.type === 'error') {
                    alert(data.message);
                }
            };
        }

        function setupAppLogic() { }

        function renderChats() {
            const list = document.getElementById('chat-list');
            list.innerHTML = '';
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            const isSearching = query.length > 0;

            if (!isSearching) {
                myGroups.forEach(g => {
                    const div = document.createElement('div');
                    div.className = 'chat-item';
                    div.onclick = () => openChat('group_' + g.id, 'group', g.name, '');
                    div.innerHTML = `
                        <div class="avatar-box" style="background:#5eb5f7; font-size:24px;">👥</div>
                        <div class="chat-info">
                            <div class="chat-top"><span class="chat-name">${g.name}</span></div>
                            <div class="chat-bottom"><span class="chat-msg">Групповой чат</span></div>
                        </div>`;
                    list.appendChild(div);
                });

                allUsers.filter(u => myContacts.includes(u.username)).forEach(u => {
                    const div = document.createElement('div');
                    div.className = 'chat-item';
                    div.onclick = () => openChat(u.username, 'user', u.display_name || u.username, u.status);
                    const avatarHtml = u.avatar ? `<img src="${u.avatar}">` : '👤';
                    const dotClass = u.status === 'online' ? 'online' : 'offline';
                    const unread = unreadMessages[u.username] || 0;
                    
                    div.innerHTML = `
                        <div class="avatar-box">${avatarHtml}<div class="status-dot ${dotClass}"></div></div>
                        <div class="chat-info">
                            <div class="chat-top"><span class="chat-name">${u.display_name || u.username}</span></div>
                            <div class="chat-bottom">
                                <span class="chat-msg">${u.bio || 'Нажмите, чтобы написать'}</span>
                                ${unread > 0 ? `<span class="unread-badge">${unread}</span>` : ''}
                            </div>
                        </div>`;
                    list.appendChild(div);
                });

                if (myGroups.length === 0 && myContacts.length === 0) {
                    list.innerHTML = '<div class="search-hint">У вас пока нет чатов.<br>Введите ID или @юзернейм в поиск, чтобы найти друга.</div>';
                }
            } else {
                let found = 0;
                allUsers.filter(u => {
                    if (u.username === myUser.username) return false;
                    const uName = u.username ? u.username.toLowerCase() : '';
                    const uId = u.six_digit_id ? u.six_digit_id.toString() : '';
                    const uDisplay = u.display_name ? u.display_name.toLowerCase() : '';
                    
                    return uName.includes(query) || uId.includes(query) || uDisplay.includes(query);
                }).forEach(u => {
                    found++;
                    const div = document.createElement('div');
                    div.className = 'chat-item';
                    div.onclick = () => {
                        if (!myContacts.includes(u.username)) myContacts.push(u.username);
                        openChat(u.username, 'user', u.display_name || u.username, u.status);
                        clearSearch();
                    };
                    const avatarHtml = u.avatar ? `<img src="${u.avatar}">` : '👤';
                    const dotClass = u.status === 'online' ? 'online' : 'offline';
                    
                    div.innerHTML = `
                        <div class="avatar-box">${avatarHtml}<div class="status-dot ${dotClass}"></div></div>
                        <div class="chat-info">
                            <div class="chat-top"><span class="chat-name">${u.display_name || u.username}</span></div>
                            <div class="chat-bottom"><span class="chat-msg">ID: ${u.six_digit_id}</span></div>
                        </div>`;
                    list.appendChild(div);
                });

                if (found === 0) {
                    list.innerHTML = '<div class="search-hint">Никого не найдено. Проверьте правильность ввода.</div>';
                }
            }
        }

        function openChat(id, type, name, status) {
            currentChatId = id;
            currentChatType = type;
            document.getElementById('chat-with').innerText = name;
            document.getElementById('chat-status').innerText = status === 'online' ? 'В сети' : 'Был(а) недавно';
            document.getElementById('messages').innerHTML = ''; 
            ws.send(JSON.stringify({ type: 'get_history', with: id }));
            
            document.getElementById('message-input').disabled = false;
            document.getElementById('send-btn').disabled = false;
            document.getElementById('gift-btn').disabled = (type === 'group'); 
            
            unreadMessages[id] = 0;
            renderChats();

            if(window.innerWidth <= 768) {
                document.getElementById('sidebar').style.display = 'none';
                document.getElementById('chat-area').style.display = 'flex';
            }
        }

        function closeChat() {
            currentChatId = null;
            if(window.innerWidth <= 768) {
                document.getElementById('sidebar').style.display = 'flex';
                document.getElementById('chat-area').style.display = 'none';
            }
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text || !currentChatId) return;

            if (currentChatType === 'user') {
                ws.send(JSON.stringify({ type: 'private', from: myUser.username, to: currentChatId, text: text }));
                if (!myContacts.includes(currentChatId)) myContacts.push(currentChatId);
            } else {
                const gId = currentChatId.split('_')[1];
                ws.send(JSON.stringify({ type: 'group_message', from: myUser.username, groupId: gId, text: text }));
            }
            addMsgToScreen(`${text} <span class="msg-time">${new Date().toLocaleTimeString()}</span>`, 'my-msg', true);
            input.value = '';
            renderChats();
        }

        document.getElementById('message-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        function addMsgToScreen(html, className, scroll) {
            const div = document.createElement('div');
            div.className = 'msg-bubble ' + className;
            div.innerHTML = html;
            document.getElementById('messages').appendChild(div);
            if(scroll) document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        }

        // КРАСИВЫЙ ВЫВОД ПОДАРКА В ЧАТЕ
        function addGiftToScreen(giftId, senderName, comment) {
            const div = document.createElement('div');
            div.className = 'gift-event';
            let wishText = (comment && comment !== 'undefined') ? `«${comment}»` : '';
            
            let svgHtml = getGiftById(giftId);
            if(svgHtml.includes('<svg')) {
                svgHtml = svgHtml.replace('class="shop-svg"', 'class="gift-svg-big"');
            }

            div.innerHTML = `
                ${svgHtml}
                <div class="gift-text">
                    ${senderName} дарит подарок!
                    ${wishText ? `<br>${wishText}` : ''}
                </div>
            `;
            document.getElementById('messages').appendChild(div);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        }

        function openUserProfile(username) {
            if(!username || currentChatType === 'group') return;
            ws.send(JSON.stringify({ type: 'get_profile', target: username }));
        }

        function openMyProfile() {
            ws.send(JSON.stringify({ type: 'get_profile', target: myUser.username }));
        }

        function openSettings() {
            document.getElementById('profile-view-overlay').classList.add('hidden'); 
            document.getElementById('settings-display-name').value = myUser.display_name;
            document.getElementById('settings-six-id').value = myUser.six_digit_id;
            document.getElementById('settings-bio').value = myUser.bio;
            document.getElementById('settings-avatar-preview').innerHTML = myUser.avatar ? `<img src="${myUser.avatar}">` : '👤';
            selectedAvatarBase64 = myUser.avatar;
            updateBalanceUI(); 
            document.getElementById('redeem-msg').innerText = ''; 
            document.getElementById('settings-overlay').classList.remove('hidden');
        }

        function saveProfile() {
            ws.send(JSON.stringify({
                type: 'update_profile',
                display_name: document.getElementById('settings-display-name').value.trim(),
                six_digit_id: document.getElementById('settings-six-id').value.trim(),
                bio: document.getElementById('settings-bio').value.trim(),
                avatar: selectedAvatarBase64,
                status: 'online'
            }));
        }

        function openCreateGroup() {
            const list = document.getElementById('group-members-list');
            list.innerHTML = allUsers.filter(u => u.username !== myUser.username).map(u => `
                <label style="display:flex; padding:10px; border-bottom:1px solid var(--border); align-items:center; cursor:pointer;">
                    <input type="checkbox" value="${u.username}" style="width:20px; margin-right:10px;">
                    ${u.display_name}
                </label>
            `).join('');
            document.getElementById('group-overlay').classList.remove('hidden');
        }

        function createGroup() {
            const name = document.getElementById('group-name').value.trim();
            if(!name) return alert("Введите название группы!");
            const members = Array.from(document.querySelectorAll('#group-members-list input:checked')).map(cb => cb.value);
            ws.send(JSON.stringify({ type: 'create_group', name: name, members: members }));
        }

        function openShop() { 
            if(currentChatId && currentChatType==='user') {
                updateBalanceUI();
                document.getElementById('shop-overlay').classList.remove('hidden'); 
            }
        }
        
        function buyGift(giftId, price) {
            const comment = prompt("Пожелание к подарку:", "Спасибо!");
            if(comment === null) return;
            
            const finalComment = comment.trim() === '' ? '' : comment;
            
            // Отправляем ID подарка (например, 'gift_rose')
            ws.send(JSON.stringify({ type: 'private', from: myUser.username, to: currentChatId, text: giftId, isGift: true, giftPrice: price, comment: finalComment }));
            addGiftToScreen(giftId, "Вы", finalComment);
            document.getElementById('shop-overlay').classList.add('hidden');
        }
        
        function toggleBlock() {
            if (!viewingUser) return;
            if (currentUserBlocked) {
                ws.send(JSON.stringify({ type: 'unblock_user', target: viewingUser }));
            } else {
                if(confirm('Вы уверены, что хотите заблокировать пользователя?')) {
                    ws.send(JSON.stringify({ type: 'block_user', target: viewingUser }));
                }
            }
        }

        function deleteChat() {
            if (!viewingUser) return;
            if(confirm('Удалить чат? История сообщений будет стерта.')) {
                ws.send(JSON.stringify({ type: 'delete_chat', target: viewingUser }));
            }
        }

        function adminGiveSelfCoins() {
            if(!myUser || myUser.username !== 'revezzz') return;
            ws.send(JSON.stringify({ type: 'admin_give_coins', target: myUser.username, amount: 10000 }));
        }

        function adminGiveCoins() {
            if(!viewingUser || myUser.username !== 'revezzz') return;
            const amount = prompt(`Сколько R-коинов начислить пользователю ${viewingUser}?`, "100");
            if(!amount || isNaN(amount)) return;
            ws.send(JSON.stringify({ type: 'admin_give_coins', target: viewingUser, amount: parseInt(amount) }));
        }

        function redeemPromo() {
            const code = document.getElementById('redeem-code-input').value.trim();
            if(!code) return;
            ws.send(JSON.stringify({ type: 'redeem_promo', code: code }));
        }

        // Создание промокода с кастомным лимитом
        function createPromo() {
            const code = document.getElementById('promo-code-input').value.trim();
            const reward = parseInt(document.getElementById('promo-reward-input').value);
            const limit = parseInt(document.getElementById('promo-limit-input').value);
            
            if(!code || !reward || !limit) return alert("Заполните все поля (название, награда, лимит)!");
            ws.send(JSON.stringify({ type: 'create_promo', code: code, reward: reward, max_uses: limit }));
            document.getElementById('promo-code-input').value = '';
        }
    </script>
</body>
</html>
