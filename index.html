<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#17212b">
    <title>Rivo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root {
            --bg-main: #0e1621; --bg-panel: #17212b; --bg-input: #242f3d;
            --accent: #5eb5f7; --text-main: #ffffff; --text-muted: #7f91a4;
            --border: #101921; --gold: #fbbf24; --online: #31a24c; --danger: #ef4444;
        }
        
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background: var(--bg-main); color: var(--text-main); font-family: 'Inter', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        #app { display: flex; width: 100%; height: 100%; }

        @keyframes modalFadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes modalFadeOut { from { opacity: 1; } to { opacity: 0; } }
        @keyframes modalSlideUp { from { transform: translateY(40px) scale(0.95); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
        @keyframes modalSlideDown { from { transform: translateY(0) scale(1); opacity: 1; } to { transform: translateY(40px) scale(0.95); opacity: 0; } }
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOutRight { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }

        /* Сайдбар */
        #sidebar { width: 340px; background: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 2; }
        .sidebar-header { padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; }
        .menu-btn { cursor: pointer; font-size: 20px; color: var(--text-muted); padding: 5px; }
        .header-balance { background: rgba(251, 191, 36, 0.15); border: 1px solid var(--gold); color: var(--gold); padding: 2px 8px; border-radius: 10px; font-size: 13px; font-weight: bold; display: flex; align-items: center; }
        .search-container { margin: 5px 15px 15px; }
        #search-input { width: 100%; padding: 10px 15px; border-radius: 20px; border: none; background: var(--bg-input); color: white; outline: none; font-size: 14px; }
        #chat-list { flex: 1; overflow-y: auto; }
        .chat-item { padding: 10px 15px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .chat-item:hover { background: var(--bg-input); }
        .avatar-box { width: 54px; height: 54px; border-radius: 50%; background: #202b36; display: flex; justify-content: center; align-items: center; font-size: 24px; position: relative; overflow: hidden; flex-shrink: 0; }
        .avatar-box img { width: 100%; height: 100%; object-fit: cover; }
        .status-dot { width: 14px; height: 14px; border-radius: 50%; position: absolute; bottom: 0; right: 0; border: 2px solid var(--bg-panel); }
        .online { background-color: var(--online); } .offline { background-color: var(--text-muted); }
        .chat-info { flex: 1; overflow: hidden; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .chat-name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .unread-badge { background: var(--accent); color: white; border-radius: 10px; padding: 2px 6px; font-size: 11px; font-weight: 600; }

        /* Чат */
        #chat-area { flex: 1; display: flex; flex-direction: column; background: #0e1621 url('https://web.telegram.org/img/tg_bg_pattern.png') repeat; position: relative; }
        #chat-header { padding: 10px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--bg-panel); z-index: 1;}
        .header-info { display: flex; align-items: center; gap: 15px; cursor: pointer; }
        .header-name { font-weight: 600; font-size: 16px; }
        .header-status { font-size: 13px; color: var(--text-muted); }
        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .msg-bubble { max-width: 60%; padding: 10px 14px; border-radius: 12px; font-size: 15px; }
        .my-msg { background: #2b5278; align-self: flex-end; border-bottom-right-radius: 4px; }
        .their-msg { background: #182533; align-self: flex-start; border-bottom-left-radius: 4px; }
        .sender-name { font-size: 12px; font-weight: 600; color: var(--accent); margin-bottom: 3px; }
        .msg-time { font-size: 11px; color: rgba(255,255,255,0.4); float: right; margin: 5px 0 0 10px; }
        #input-area { padding: 10px 20px; display: flex; gap: 10px; background: var(--bg-panel); align-items: center; z-index: 1;}
        #message-input { flex: 1; padding: 12px 15px; border-radius: 20px; border: none; background: var(--bg-input); color: white; outline: none; font-size: 15px; }
        .action-btn { background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; padding: 5px; }

        /* Модалки */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 100; animation: modalFadeIn 0.3s; }
        .modal-overlay.animate-out { animation: modalFadeOut 0.25s forwards; }
        .modal-box { background: var(--bg-panel); border-radius: 16px; width: 420px; max-height: 90vh; overflow-y: auto; padding: 20px; animation: modalSlideUp 0.3s; }
        .modal-overlay.animate-out .modal-box { animation: modalSlideDown 0.25s forwards; }
        .modal-box h2 { margin-top: 0; text-align: center; }
        .modal-box input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-main); color: white; outline: none; }
        .modal-box button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: var(--accent); color: white; font-weight: 600; cursor: pointer; margin-bottom: 10px; }
        .hidden { display: none !important; }

        /* Профиль */
        .tg-profile-card { background: var(--bg-panel); border-radius: 16px; overflow: hidden; border: 1px solid var(--border); position: relative; margin-bottom: 20px; }
        .tg-cover { height: 120px; background: linear-gradient(135deg, #2b5278, #17212b, #1e3a8a); width: 100%; }
        .tg-avatar-wrapper { position: relative; margin: -50px auto 10px; width: 100px; height: 100px; z-index: 2; }
        .tg-avatar { width: 100%; height: 100%; border-radius: 50%; background: #202b36; display: flex; justify-content: center; align-items: center; font-size: 45px; border: 4px solid var(--bg-panel); overflow: hidden; }
        .tg-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .tg-badges { display: flex; justify-content: center; gap: 5px; margin-bottom: 10px; }
        .tg-badge { width: 24px; height: 24px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 12px; color: white; }
        .tg-info-block { background: rgba(0,0,0,0.2); border-radius: 12px; padding: 12px 15px; margin: 10px 15px; border: 1px solid rgba(255,255,255,0.05); }
        .tg-info-label { color: var(--accent); font-size: 12px; margin-bottom: 2px; }
        .tg-info-value { color: white; font-size: 15px; }

        /* Подарки в профиле */
        .gift-list { display: flex; flex-wrap: wrap; gap: 10px; padding: 0 15px; }
        .profile-gift-card { background: var(--bg-main); padding: 10px; border-radius: 10px; text-align: center; width: 80px; border: 1px solid var(--border); }
        .profile-gift-emoji { font-size: 32px; }
        .profile-gift-sender { font-size: 10px; color: var(--text-muted); margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Магазин */
        .shop-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .shop-item { background: var(--bg-main); padding: 15px; border-radius: 12px; text-align: center; cursor: pointer; border: 1px solid var(--border); transition: 0.2s; }
        .shop-item:hover { transform: scale(1.05); border-color: var(--gold); }
        .shop-emoji { font-size: 40px; }
        .shop-price { color: var(--gold); font-weight: bold; margin-top: 10px; }

        /* Подарок в чате */
        .gift-event { align-self: center; display: flex; flex-direction: column; align-items: center; margin: 20px 0; }
        .gift-icon { font-size: 80px; }
        .gift-text { background: rgba(0,0,0,0.6); padding: 8px 20px; border-radius: 20px; margin-top: 10px; font-size: 13px; color: #fbbf24; border: 1px solid var(--gold); text-align: center; }

        .admin-btn { background: linear-gradient(135deg, #fbbf24, #f59e0b) !important; color: #000 !important; font-weight: bold; }

        #back-btn { display: none; cursor: pointer; font-size: 24px; color: var(--accent); margin-right: 10px; }
        @media (max-width: 768px) {
            #sidebar { width: 100%; }
            #chat-area { display: none; width: 100%; position: absolute; height: 100%; z-index: 10; }
            #chat-area.active { display: flex; animation: slideInRight 0.3s forwards; }
            #chat-area.animate-out { animation: slideOutRight 0.25s forwards; }
            #back-btn { display: block; }
            .msg-bubble { max-width: 85%; }
            .modal-box { width: 95%; padding: 15px; }
        }
    </style>
</head>
<body>

    <div id="login-overlay" class="modal-overlay">
        <div class="modal-box">
            <h2>Rivo</h2>
            <input type="text" id="auth-username" placeholder="Юзернейм">
            <input type="password" id="auth-password" placeholder="Пароль">
            <button id="main-auth-btn" onclick="submitAuth()">Войти</button>
            <div style="text-align:center; color:var(--accent); cursor:pointer; margin-top:15px;" id="switch-text" onclick="toggleAuthMode()">Нет аккаунта? Зарегистрироваться</div>
            <div id="auth-error" style="color: #ef4444; margin-top: 10px; text-align: center;"></div>
        </div>
    </div>

    <!-- ПРОФИЛЬ -->
    <div id="profile-view-overlay" class="modal-overlay hidden">
        <div class="modal-box" style="padding: 0; background: transparent; border: none; width: 400px;">
            <div class="tg-profile-card">
                <div class="tg-cover"></div>
                <div class="tg-avatar-wrapper">
                    <div class="tg-avatar" id="view-avatar">👤</div>
                </div>
                
                <div class="tg-badges">
                    <div class="tg-badge" style="background:#5eb5f7;" title="Верифицирован">✓</div>
                    <div class="tg-badge" style="background:#fbbf24;" title="Premium">👑</div>
                </div>

                <h2 style="margin: 0; font-size: 22px; text-align: center;" id="view-name"></h2>
                <div style="font-size: 14px; color: var(--accent); margin-top: 5px; text-align: center;" id="view-username"></div>
                <div style="font-size: 14px; color: var(--text-muted); margin-top: 10px; text-align: center; padding: 0 15px;" id="view-bio"></div>
                
                <div style="display:flex; gap:10px; padding: 15px;">
                    <div class="tg-info-block" style="flex:1; margin:0;">
                        <div class="tg-info-label">ID</div>
                        <div class="tg-info-value" id="view-id"></div>
                    </div>
                    <div class="tg-info-block" style="flex:1; margin:0; border-color: rgba(251,191,36,0.3);">
                        <div class="tg-info-label" style="color: var(--gold);">Баланс</div>
                        <div class="tg-info-value" style="color: var(--gold);" id="view-balance"></div>
                    </div>
                </div>

                <h4 style="margin: 15px 15px 5px 15px; color: var(--text-muted); font-size: 14px;">🎁 Подарки</h4>
                <div class="gift-list" id="view-gifts"></div>

                <div style="padding: 20px 15px;">
                    <div id="other-profile-actions" style="display:none; gap:10px; margin-bottom:10px;">
                        <button onclick="toggleBlock()" style="background:var(--danger); width:100%; padding:12px; border-radius:8px; border:none; color:white; font-weight:bold;">Заблокировать</button>
                        <button id="admin-give-btn" class="admin-btn hidden" onclick="adminGiveCoins()" style="width:100%; padding:12px; border-radius:8px; border:none; margin-top:10px;">Начислить 100 R</button>
                    </div>
                    
                    <div id="my-profile-actions" class="hidden" style="display:flex; flex-direction:column; gap:10px;">
                        <button onclick="openSettings()" style="background:var(--accent); width:100%; padding:12px; border-radius:8px; border:none; color:white; font-weight:bold;">Настройки</button>
                        <button onclick="logout()" style="background:var(--danger); width:100%; padding:12px; border-radius:8px; border:none; color:white; font-weight:bold;">Выйти</button>
                    </div>

                    <button onclick="closeModal('profile-view-overlay')" style="margin-top:15px; background:transparent; color:var(--text-muted); border:1px solid var(--border); width:100%; padding:12px; border-radius:8px; cursor:pointer;">Закрыть</button>
                </div>
            </div>
        </div>
    </div>

    <!-- МАГАЗИН -->
    <div id="shop-overlay" class="modal-overlay hidden">
        <div class="modal-box">
            <h2>Магазин подарков</h2>
            <div style="text-align:center; color:var(--gold); margin-bottom:15px; font-weight:bold;">
                Ваш баланс: <span id="shop-balance">0</span> R
            </div>
            <div class="shop-grid" id="shop-grid"></div>
            <button onclick="closeModal('shop-overlay')" style="margin-top:20px; background:var(--bg-input);">Закрыть</button>
        </div>
    </div>

    <!-- НАСТРОЙКИ -->
    <div id="settings-overlay" class="modal-overlay hidden">
        <div class="modal-box">
            <h2>Настройки</h2>
            <div style="margin-bottom: 20px; background: rgba(255,255,255,0.03); padding: 10px; border-radius: 8px; border: 1px dashed var(--accent);">
                <label style="font-size:12px; color:var(--accent); font-weight:bold; margin-bottom:5px; display:block;">Промокод</label>
                <div style="display:flex; gap:8px;">
                    <input type="text" id="redeem-code-input" placeholder="RIVO100" style="margin-bottom:0; text-transform:uppercase; flex:1;">
                    <button onclick="redeemPromo()" style="width:auto; margin-bottom:0; padding:0 15px; background:var(--gold); color:black; font-weight:bold;">OK</button>
                </div>
                <div id="redeem-msg" style="font-size:12px; margin-top:5px; text-align:center; font-weight:bold;"></div>
            </div>

            <div style="text-align:center; margin-bottom:15px;">
                <div class="tg-avatar" style="width: 90px; height: 90px; margin: 0 auto 10px;" id="settings-avatar-preview"></div>
                <label for="avatar-upload" style="background:var(--bg-input); padding:8px 15px; border-radius:20px; cursor:pointer; font-size:13px;">Сменить фото</label>
                <input type="file" id="avatar-upload" accept="image/*" style="display:none;" onchange="handleAvatarUpload(event)">
            </div>
            <label>Имя</label>
            <input type="text" id="settings-display-name">
            <label>6-значный ID</label>
            <input type="text" id="settings-six-id" maxlength="6">
            <label>О себе</label>
            <input type="text" id="settings-bio">
            <button onclick="saveProfile()">Сохранить</button>
            
            <div id="admin-panel" class="hidden" style="margin-top: 20px; border-top: 1px solid var(--border); padding-top: 15px;">
                <h3 style="text-align:center; color: var(--gold);">Панель создателя</h3>
                <button onclick="adminGiveSelfCoins()" style="background:var(--gold); color:black;">Начислить себе 10 000 R</button>
                <input type="text" id="promo-code-input" placeholder="Промокод (напр. RIVO100)" style="margin-top:10px;">
                <input type="number" id="promo-reward-input" placeholder="Награда (коины)" value="50">
                <input type="number" id="promo-limit-input" placeholder="Лимит (человек)" value="10">
                <button onclick="createPromo()" style="background:var(--gold); color:black;">Создать промокод</button>
                <div id="promo-admin-msg" style="text-align:center; font-size:12px; margin-top:10px; font-weight:bold;"></div>
            </div>

            <button onclick="logout()" style="background:var(--danger); margin-top: 20px;">Выйти</button>
            <button onclick="closeModal('settings-overlay')" style="background:transparent; border:1px solid var(--border);">Отмена</button>
        </div>
    </div>

    <!-- ГРУППЫ -->
    <div id="group-overlay" class="modal-overlay hidden">
        <div class="modal-box">
            <h2>Новая группа</h2>
            <input type="text" id="group-name" placeholder="Название группы">
            <div style="font-size:12px; color:var(--text-muted); margin-bottom:5px;">Выберите участников:</div>
            <div id="group-members-list" style="max-height:150px; overflow-y:auto; margin-bottom:15px; border:1px solid var(--border); border-radius:8px;"></div>
            <button onclick="createGroup()">Создать</button>
            <button onclick="closeModal('group-overlay')" style="background:transparent; border:1px solid var(--border);">Отмена</button>
        </div>
    </div>

    <div id="app" class="hidden">
        <div id="sidebar">
            <div class="sidebar-header">
                <div class="menu-btn" onclick="openMyProfile()">☰</div>
                <div style="font-weight:bold; font-size:18px;">Rivo</div>
                <div class="menu-btn" onclick="openCreateGroup()">➕</div>
            </div>
            <div class="search-container"><input type="text" id="search-input" placeholder="Поиск..." oninput="renderChats()"></div>
            <div id="chat-list"></div>
        </div>

        <div id="chat-area">
            <div id="chat-header">
                <div style="display:flex; align-items:center;">
                    <div id="back-btn" onclick="closeChat()">←</div>
                    <div class="header-info" onclick="openUserProfile(currentChatId)">
                        <div class="avatar-box" id="chat-header-avatar"></div>
                        <div><div class="header-name" id="chat-with">Выберите чат</div><div class="header-status" id="chat-status">В сети</div></div>
                    </div>
                </div>
                <div><button class="action-btn" onclick="openShop()" id="gift-btn" disabled>🎁</button></div>
            </div>
            <div id="messages"></div>
            <div id="input-area">
                <input type="text" id="message-input" placeholder="Сообщение..." disabled>
                <button class="action-btn" onclick="sendMessage()" id="send-btn" disabled>➤</button>
            </div>
        </div>
    </div>

    <script>
        window.onerror = function(m, s, l) { alert("Ошибка: " + m + " (Строка: " + l + ")"); return false; };

        let ws, myUser = null, isLoginMode = true;
        let allUsers = [], myContacts = [], myGroups = [], unreadMessages = {};
        let selectedAvatarBase64 = "", viewingUser = null, currentChatId = null, currentChatType = null;

        const GIFTS = {
            'gift_rose': { name: 'Роза', price: 10, emoji: '🌹' },
            'gift_bear': { name: 'Мишка', price: 100, emoji: '🧸' },
            'gift_diamond': { name: 'Алмаз', price: 500, emoji: '💎' },
            'gift_crown': { name: 'Корона', price: 1000, emoji: '👑' }
        };

        function closeModal(id) {
            const m = document.getElementById(id); if(!m) return;
            m.classList.add('animate-out');
            setTimeout(() => { m.classList.remove('animate-out'); m.classList.add('hidden'); }, 250); 
        }

        function updateBalanceUI() {
            if(!myUser) return;
            const bal = document.getElementById('header-balance-val'); if(bal) bal.innerText = myUser.coins;
            const sb = document.getElementById('settings-balance'); if(sb) sb.innerText = myUser.coins;
            const shb = document.getElementById('shop-balance'); if(shb) shb.innerText = myUser.coins;
            const vb = document.getElementById('view-balance'); if(vb && viewingUser === myUser.username) vb.innerText = myUser.coins + ' R';
        }

        function handleAvatarUpload(e) {
            const f = e.target.files[0]; if(!f) return;
            const r = new FileReader();
            r.onload = ev => {
                const img = new Image();
                img.onload = () => {
                    const c = document.createElement('canvas'); const MAX = 100;
                    let w = img.width, h = img.height;
                    if (w > h) { if (w > MAX) { h *= MAX / w; w = MAX; } } else { if (h > MAX) { w *= MAX / h; h = MAX; } }
                    c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h);
                    selectedAvatarBase64 = c.toDataURL('image/jpeg');
                    document.getElementById('settings-avatar-preview').innerHTML = `<img src="${selectedAvatarBase64}">`;
                }; img.src = ev.target.result;
            }; r.readAsDataURL(f);
        }

        window.onload = () => {
            const sg = document.getElementById('shop-grid');
            Object.keys(GIFTS).forEach(k => {
                const g = GIFTS[k];
                const d = document.createElement('div');
                d.className = 'shop-item';
                d.innerHTML = `<div class="shop-emoji">${g.emoji}</div><div style="color:var(--gold); font-weight:bold; margin-top:10px;">${g.price} R</div>`;
                d.onclick = () => buyGift(k, g.price);
                sg.appendChild(d);
            });

            const savedUser = localStorage.getItem('rivo_user');
            const savedPass = localStorage.getItem('rivo_pass');
            if (savedUser && savedPass) {
                document.getElementById('auth-username').value = savedUser;
                document.getElementById('auth-password').value = savedPass;
                submitAuth();
            }
        };

        function logout() { localStorage.removeItem('rivo_user'); localStorage.removeItem('rivo_pass'); location.reload(); }
        function toggleAuthMode() { isLoginMode = !isLoginMode; document.getElementById('main-auth-btn').innerText = isLoginMode ? 'Войти' : 'Создать'; document.getElementById('switch-text').innerText = isLoginMode ? 'Нет аккаунта?' : 'Есть аккаунт?'; document.getElementById('auth-error').innerText = ''; }

        function submitAuth() {
            const u = document.getElementById('auth-username').value.trim();
            const p = document.getElementById('auth-password').value.trim();
            if(!u || !p) return document.getElementById('auth-error').innerText = "Заполните поля!";
            const proto = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
            if(ws) ws.close();
            ws = new WebSocket(proto + window.location.host);

            ws.onopen = () => ws.send(JSON.stringify({ type: isLoginMode ? 'login' : 'register', username: u, password: p }));

            ws.onmessage = ev => {
                const data = JSON.parse(ev.data);
                if (data.type === 'force_logout') { alert(data.message); logout(); return; }
                if (data.type === 'auth_error') document.getElementById('auth-error').innerText = data.message;
                
                if (data.type === 'auth_success') {
                    if(!isLoginMode) { toggleAuthMode(); setTimeout(submitAuth, 500); return; }
                    localStorage.setItem('rivo_user', u); localStorage.setItem('rivo_pass', p);
                    myUser = data.user; selectedAvatarBase64 = myUser.avatar || '';
                    if (myUser.username === 'revezzz') document.getElementById('admin-panel').classList.remove('hidden');
                    document.getElementById('login-overlay').classList.add('hidden'); document.getElementById('app').classList.remove('hidden');
                    updateBalanceUI(); ws.send(JSON.stringify({ type: 'get_groups' })); ws.send(JSON.stringify({ type: 'get_chat_list' })); 
                }
                
                if(data.type === 'user_list') { allUsers = data.users; renderChats(); }
                if(data.type === 'chat_list') { myContacts = data.contacts; renderChats(); }
                if(data.type === 'my_groups') { myGroups = data.groups; renderChats(); }
                
                if (data.type === 'profile_data') {
                    const usr = data.user; viewingUser = usr.username;
                    document.getElementById('view-avatar').innerHTML = usr.avatar ? `<img src="${usr.avatar}">` : '👤';
                    document.getElementById('view-name').innerText = usr.display_name;
                    document.getElementById('view-username').innerText = '@' + usr.username;
                    document.getElementById('view-bio').innerText = usr.bio || '';
                    document.getElementById('view-id').innerText = usr.six_digit_id;
                    document.getElementById('view-balance').innerText = usr.coins + ' R';

                    const giftsDiv = document.getElementById('view-gifts');
                    giftsDiv.innerHTML = '';
                    if (data.gifts.length === 0) {
                        giftsDiv.innerHTML = '<p style="color:var(--text-muted); font-size:12px; padding:0 15px;">Пока нет подарков</p>';
                    } else {
                        data.gifts.forEach(g => {
                            const d = document.createElement('div');
                            d.className = 'profile-gift-card';
                            d.innerHTML = `<div class="profile-gift-emoji">${g.gift_emoji}</div><div class="profile-gift-sender">от ${g.sender}</div>`;
                            giftsDiv.appendChild(d);
                        });
                    }

                    if (usr.username === myUser.username) {
                        document.getElementById('my-profile-actions').classList.remove('hidden');
                        document.getElementById('other-profile-actions').style.display = 'none';
                    } else {
                        document.getElementById('my-profile-actions').classList.add('hidden');
                        document.getElementById('other-profile-actions').style.display = 'block';
                        if (myUser.username === 'revezzz') document.getElementById('admin-give-btn').classList.remove('hidden');
                    }
                    
                    document.getElementById('profile-view-overlay').classList.remove('hidden', 'animate-out');
                }

                if (data.type === 'update_coins') { myUser.coins = data.coins; updateBalanceUI(); }
                if (data.type === 'profile_saved') { myUser = data.user; updateBalanceUI(); alert('Сохранено!'); closeModal('settings-overlay'); }
                if (data.type === 'admin_success') { alert(data.message); }
                if (data.type === 'error') alert(data.message);

                if (data.type === 'history') {
                    const md = document.getElementById('messages'); md.innerHTML = '';
                    data.messages.forEach(m => {
                        const isMe = m.sender === myUser.username;
                        if (m.isGift) {
                            md.innerHTML += `<div class="gift-event"><div class="gift-icon">${m.text}</div><div class="gift-text">${isMe ? 'Вы' : m.sender} дарит подарок!<br>«${m.comment || ''}»</div></div>`;
                        } else {
                            md.innerHTML += `<div class="msg-bubble ${isMe?'my-msg':'their-msg'}">${m.text} <span class="msg-time">${m.timestamp||''}</span></div>`;
                        }
                    });
                    md.scrollTop = md.scrollHeight;
                }

                if (data.type === 'private' || data.type === 'group_message') {
                    const cid = data.type === 'private' ? data.from : 'group_' + data.groupId;
                    if (currentChatId === cid) {
                        if (data.isGift) {
                            document.getElementById('messages').innerHTML += `<div class="gift-event"><div class="gift-icon">${data.text}</div><div class="gift-text">${data.from} дарит подарок!<br>«${data.comment || ''}»</div></div>`;
                        } else {
                            document.getElementById('messages').innerHTML += `<div class="msg-bubble their-msg">${data.text} <span class="msg-time">${data.time}</span></div>`;
                        }
                        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
                    }
                }
            };
        }

        function buyGift(giftId, price) {
            if (!currentChatId) return alert("Выберите чат, чтобы отправить подарок!");
            const comment = prompt("Пожелание к подарку:", "Спасибо!");
            if (comment === null) return;
            ws.send(JSON.stringify({ type: 'private', from: myUser.username, to: currentChatId, text: GIFTS[giftId].emoji, isGift: true, giftPrice: price, comment: comment }));
            closeModal('shop-overlay');
        }

        function renderChats() {
            const list = document.getElementById('chat-list'); list.innerHTML = '';
            myGroups.forEach(g => {
                const d = document.createElement('div'); d.className = 'chat-item';
                d.onclick = () => openChat('group_'+g.id, 'group', g.name, '');
                d.innerHTML = `<div class="avatar-box" style="background:#5eb5f7; font-size:24px;">👥</div><div class="chat-info"><span class="chat-name">${g.name}</span></div>`;
                list.appendChild(d);
            });
            allUsers.filter(u => myContacts.includes(u.username)).forEach(u => {
                const d = document.createElement('div'); d.className = 'chat-item';
                d.onclick = () => openChat(u.username, 'user', u.display_name || u.username, u.status);
                const av = u.avatar ? `<img src="${u.avatar}">` : '👤';
                const dot = u.status === 'online' ? 'online' : 'offline';
                d.innerHTML = `<div class="avatar-box">${av}<div class="status-dot ${dot}"></div></div><div class="chat-info"><span class="chat-name">${u.display_name||u.username}</span></div>`;
                list.appendChild(d);
            });
        }

        function openChat(id, type, name, status) {
            currentChatId = id; currentChatType = type;
            document.getElementById('chat-with').innerText = name;
            document.getElementById('chat-status').innerText = status==='online'?'В сети':'Не в сети';
            document.getElementById('messages').innerHTML = '';
            ws.send(JSON.stringify({ type: 'get_history', with: id }));
            document.getElementById('message-input').disabled = false;
            document.getElementById('send-btn').disabled = false;
            document.getElementById('gift-btn').disabled = (type === 'group');
            if(window.innerWidth <= 768) { document.getElementById('sidebar').style.display='none'; document.getElementById('chat-area').style.display='flex'; document.getElementById('chat-area').classList.add('active'); }
        }

        function closeChat() {
            if(window.innerWidth <= 768) {
                document.getElementById('chat-area').classList.add('animate-out');
                setTimeout(() => { document.getElementById('chat-area').style.display='none'; document.getElementById('chat-area').classList.remove('animate-out','active'); document.getElementById('sidebar').style.display='flex'; }, 250);
            }
            currentChatId = null;
        }

        function sendMessage() {
            const i = document.getElementById('message-input'); const t = i.value.trim();
            if(!t || !currentChatId) return;
            if(currentChatType === 'user') ws.send(JSON.stringify({ type: 'private', from: myUser.username, to: currentChatId, text: t }));
            else ws.send(JSON.stringify({ type: 'group_message', from: myUser.username, groupId: currentChatId.split('_')[1], text: t }));
            i.value = '';
        }
        document.getElementById('message-input').addEventListener('keypress', e => { if(e.key==='Enter') sendMessage(); });

        function openUserProfile(u) { ws.send(JSON.stringify({ type: 'get_profile', target: u })); }
        function openMyProfile() { ws.send(JSON.stringify({ type: 'get_profile', target: myUser.username })); }
        function openShop() { if(currentChatId) document.getElementById('shop-overlay').classList.remove('hidden', 'animate-out'); }
        function openSettings() {
            closeModal('profile-view-overlay');
            document.getElementById('settings-display-name').value = myUser.display_name;
            document.getElementById('settings-six-id').value = myUser.six_digit_id;
            document.getElementById('settings-bio').value = myUser.bio;
            document.getElementById('settings-avatar-preview').innerHTML = myUser.avatar ? `<img src="${myUser.avatar}">` : '👤';
            document.getElementById('settings-overlay').classList.remove('hidden', 'animate-out');
        }
        function saveProfile() { ws.send(JSON.stringify({ type: 'update_profile', display_name: document.getElementById('settings-display-name').value.trim(), six_digit_id: document.getElementById('settings-six-id').value.trim(), bio: document.getElementById('settings-bio').value.trim(), avatar: selectedAvatarBase64, status: 'online' })); }

        function openCreateGroup() {
            const list = document.getElementById('group-members-list');
            list.innerHTML = allUsers.filter(u => u.username !== myUser.username).map(u => `<label style="display:flex; padding:10px; border-bottom:1px solid var(--border); cursor:pointer;"><input type="checkbox" value="${u.username}" style="width:20px; margin-right:10px;">${u.display_name}</label>`).join('');
            document.getElementById('group-overlay').classList.remove('hidden', 'animate-out');
        }
        function createGroup() {
            const name = document.getElementById('group-name').value.trim();
            if(!name) return alert("Введите название!");
            const members = Array.from(document.querySelectorAll('#group-members-list input:checked')).map(cb => cb.value);
            ws.send(JSON.stringify({ type: 'create_group', name: name, members: members }));
        }

        function toggleBlock() { if (!viewingUser) return; if (confirm('Заблокировать?')) ws.send(JSON.stringify({ type: 'block_user', target: viewingUser })); }
        function adminGiveSelfCoins() { if(myUser.username !== 'revezzz') return; ws.send(JSON.stringify({ type: 'admin_give_coins', target: myUser.username, amount: 10000 })); }
        function adminGiveCoins() { if(myUser.username !== 'revezzz') return; const p = prompt("Сколько?", "100"); if(p) ws.send(JSON.stringify({ type: 'admin_give_coins', target: viewingUser, amount: parseInt(p) })); }
        function redeemPromo() { const c = document.getElementById('redeem-code-input').value.trim(); if(c) ws.send(JSON.stringify({ type: 'redeem_promo', code: c })); }
        function createPromo() { const c = document.getElementById('promo-code-input').value.trim(); const r = parseInt(document.getElementById('promo-reward-input').value); const l = parseInt(document.getElementById('promo-limit-input').value); if(c && r && l) ws.send(JSON.stringify({ type: 'create_promo', code: c, reward: r, max_uses: l })); }
    </script>
</body>
</html>
